# /etc/nginx/sites-available/definity
# Symlink into sites-enabled, then `nginx -t && systemctl reload nginx`.
#
# Assumes:
#   - Next.js standalone server is running on 127.0.0.1:3000 (systemd unit below).
#   - certbot has issued a cert for definity.finance and www.definity.finance.
#   - You optionally front this with Cloudflare for DDoS / CDN.

# Redirect all HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name definity.finance www.definity.finance;

    # ACME challenge for certbot renewals
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

# Apex HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name definity.finance;

    ssl_certificate     /etc/letsencrypt/live/definity.finance/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/definity.finance/privkey.pem;

    # SSL settings (Mozilla "intermediate", inlined so we don't depend on
    # certbot's options-ssl-nginx.conf / ssl-dhparams.pem — those ship with
    # the --nginx plugin but not with --webroot on certbot 5.x snap).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # OCSP stapling intentionally disabled: Let's Encrypt's E-series intermediate
    # certs no longer include an OCSP responder URL (LE is migrating to CRLs).

    # Sensible defaults
    server_tokens off;
    client_max_body_size 1m;

    # Security headers (Next.js also sends some — these are belt-and-braces)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # Basic rate limit on the app — protects against bot floods
    limit_req zone=app burst=40 nodelay;

    # Serve /reports/* from a durable path that survives release dir swaps.
    # daily-report.service writes here directly. Reports include applicant
    # samples (vote id + contact info from /api/whitelist) so we gate them
    # with basic auth — htpasswd file is provisioned per-host (see
    # /root/reports-creds.txt and SERVER-PROVISIONING.md).
    location /reports/ {
        auth_basic "Definity reports";
        auth_basic_user_file /etc/nginx/.htpasswd-reports;
        alias /var/lib/definity/reports/;
        try_files $uri =404;
    }

    # Static files served by Next.js standalone are at /_next/static — cache hard
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Anything in /public served via Next — short cache, allow revalidation
    location ~* \.(?:ico|png|jpg|jpeg|gif|webp|avif|svg|woff2?|ttf|eot)$ {
        proxy_pass http://127.0.0.1:3000;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Everything else -> Next.js
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_pass http://127.0.0.1:3000;
    }
}

# Redirect www -> apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.definity.finance;

    ssl_certificate     /etc/letsencrypt/live/definity.finance/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/definity.finance/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://definity.finance$request_uri;
}

# ─────────────────────────────────────────────────────────────────────────────
# STAGING — test.definity.finance
#
# Mirrors the production server block but proxies to the staging Node process
# on :5100 instead of :3000. Gated by nginx basic auth (htpasswd file at
# /etc/nginx/.htpasswd-staging) so the staging URL is unindexable by search
# engines and unreachable to drive-by traffic / URL reputation classifiers.
# Also overrides /robots.txt at the nginx layer with a strict Disallow so even
# authenticated crawlers see the no-index signal.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name test.definity.finance;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name test.definity.finance;

    ssl_certificate     /etc/letsencrypt/live/test.definity.finance/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.definity.finance/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 1m;

    # Belt-and-braces security headers (matches prod).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # No HSTS preload on staging — we don't want test.definity.finance pinned
    # in browser HSTS lists if/when the staging cert lapses or hostname moves.
    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;

    # Gate everything behind basic auth.
    auth_basic "Definity staging";
    auth_basic_user_file /etc/nginx/.htpasswd-staging;

    # Override /robots.txt at nginx layer — even if auth-bypassed somehow, the
    # disallow is the authoritative signal. auth_basic off so crawlers can read
    # it without credentials and obey the disallow.
    location = /robots.txt {
        auth_basic off;
        return 200 "User-agent: *\nDisallow: /\n";
        default_type text/plain;
    }

    # Same /reports/ alias pattern as prod, durable path outside the release tree.
    location /reports/ {
        alias /var/lib/definity-staging/reports/;
        try_files $uri =404;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:5100;
        proxy_cache_valid 200 365d;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:ico|png|jpg|jpeg|gif|webp|avif|svg|woff2?|ttf|eot)$ {
        proxy_pass http://127.0.0.1:5100;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_pass http://127.0.0.1:5100;
    }
}
