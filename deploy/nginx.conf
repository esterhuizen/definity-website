# /etc/nginx/sites-available/definity
# Symlink into sites-enabled, then `nginx -t && systemctl reload nginx`.
#
# Assumes:
#   - Next.js standalone server is running on 127.0.0.1:3000 (systemd unit below).
#   - certbot has issued a cert for definity.finance and www.definity.finance.
#   - You optionally front this with Cloudflare for DDoS / CDN.

# Redirect all HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name definity.finance www.definity.finance;

    # ACME challenge for certbot renewals
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

# Apex HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name definity.finance;

    ssl_certificate     /etc/letsencrypt/live/definity.finance/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/definity.finance/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Sensible defaults
    server_tokens off;
    client_max_body_size 1m;

    # Security headers (Next.js also sends some — these are belt-and-braces)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # Basic rate limit on the app — protects against bot floods
    limit_req zone=app burst=40 nodelay;

    # Static files served by Next.js standalone are at /_next/static — cache hard
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Anything in /public served via Next — short cache, allow revalidation
    location ~* \.(?:ico|png|jpg|jpeg|gif|webp|avif|svg|woff2?|ttf|eot)$ {
        proxy_pass http://127.0.0.1:3000;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Everything else -> Next.js
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_pass http://127.0.0.1:3000;
    }
}

# Redirect www -> apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.definity.finance;

    ssl_certificate     /etc/letsencrypt/live/definity.finance/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/definity.finance/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://definity.finance$request_uri;
}
