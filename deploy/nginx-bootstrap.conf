# /etc/nginx/sites-available/definity
#
# BOOTSTRAP config — install this BEFORE you have a TLS cert.
# It only listens on port 80 and exposes the ACME challenge path that
# certbot uses to prove ownership of the domain. Once the cert is
# issued by `tls-issue.sh`, replace this file with `nginx.conf` and
# reload nginx.
#
# Symlink + activate:
#   sudo ln -sf /etc/nginx/sites-available/definity /etc/nginx/sites-enabled/definity
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name definity.finance www.definity.finance;

    # certbot writes the challenge file here; root must match tls-issue.sh
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Until the cert is issued, proxy everything else to the app on :3000
    # so you can sanity-check the site over plain HTTP from inside the box.
    # Public users won't reach this because DNS will be cut over only after
    # TLS is live, but it makes debugging easier.
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:3000;
    }
}
